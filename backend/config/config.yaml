# Configurazione dell'agente MCP per Ollama

# Impostazioni generali
agent:
  name: "MCP-Ollama-Agent"
  version: "1.0.0"
  description: "Agente multi-componente per l'interfaccia con modelli Ollama"

# Configurazione Ollama
ollama:
  base_url: "http://localhost:11434"
  default_model: "llama3.2:latest"
  timeout: 120
  
# Modelli disponibili (verranno caricati dinamicamente)
models:
  primary: "llama3.3:70b"
  secondary: "qwen2.5:72b"
  code_assistant: "deepseek-coder:33b"
  math_specialist: "qwen2.5-math:72b"
  finance_specialist: "llama3.3:70b"
  general: "mistral:7b"
  writing_specialist: "llama3.3:70b"  # Per testi e libri
  story_revision: "mistral:7b"        # Per revisione storie

# Parametri di generazione
generation:
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  max_tokens: 2048

# Memoria
memory:
  short_term_limit: 20  # Numero massimo di interazioni nella memoria a breve termine
  long_term_file: "long_term_memory.json"
  
# Task management
tasks:
  max_concurrent: 3
  timeout: 300  # 5 minuti per task